name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Check UTF-8 BOM
        shell: pwsh
        run: ./tools/check-bom.ps1

      - name: Restore + Build
        run: msbuild IntraBox.sln /t:Restore;Build /p:Configuration=Release /m

      - name: Run tests
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -property installationPath
          $vstest = Join-Path $vs "Common7\IDE\CommonExtensions\Microsoft\TestWindow\vstest.console.exe"
          & $vstest tests\IntraBox.Tests\bin\Release\IntraBox.Tests.dll
